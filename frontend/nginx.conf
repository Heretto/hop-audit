# The web container: the Angular app, and /api proxied to the backend.
# Plain HTTP only. On the shared VM, Caddy terminates TLS in front of it
# and sends X-Forwarded-For / X-Forwarded-Proto, which are trusted from the
# private ranges below. Never redirect to HTTPS here: Caddy speaks HTTP to
# this server, so a redirect would loop.

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# https behind Caddy; the request's own scheme when nothing is in front.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Prospect logos are sent as data URIs (up to 512 KB of image).
    client_max_body_size 10m;

    location /api/ {
        proxy_pass         http://hop-audit-backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # $remote_addr is the visitor's address once real_ip has read Caddy's header.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;  # report and one-sheet PDFs render in Chromium
    }

    # Cheap probe for Docker and Caddy: the backend's health, which checks
    # the database.
    location = /health {
        proxy_pass         http://hop-audit-backend:8000/api/health;
        proxy_set_header   Host $host;
        access_log         off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
